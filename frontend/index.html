<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>Apuração - Votação</title>
</head>

<body>
    <div class="main-container">
        <header class="header">
            <span class="badge">Painel em Tempo Real</span>
            <h1>Apuração dos Votos</h1>
            <p class="subtitulo">Acompanhamento dos dados salvos no banco de dados</p>
        </header>

        <main class="card">
            <div class="canvas-container">
                <canvas id="graficoVotos"></canvas>
            </div>

            <div class="barra-de-acoes">
                <button class="btn btn-secundario" onclick="atualizarApuracao()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                    Atualizar Dados
                </button>
                <button class="btn btn-zerar" onclick="zerarVotacao()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                    Zerar Votação
                </button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
